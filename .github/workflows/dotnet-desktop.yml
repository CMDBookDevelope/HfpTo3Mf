name: Build Wpf Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: HfpTo3mf.sln
      Project_Path: WpfApp1\HfpTo3mf.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release /p:Platform="Any CPU"

    - name: Build Release
      run: msbuild $env:Project_Path /p:Configuration=Release /p:Platform="Any CPU"

    - name: Zip output binaries
      shell: pwsh
      run: |
        $outDir = "WpfApp1\bin\Release"
        $zipName = "HfpTo3mf-release.zip"
        Compress-Archive -Path "$outDir\*" -DestinationPath $zipName
        echo "ZIP_FILE=$zipName" | Out-File -Append $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: auto-${{ github.sha }}
        name: Build ${{ github.sha }}
        files: |
          ${{ env.ZIP_FILE }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
